name: Build DynamicNotch

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build macOS App
    runs-on: macos-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Build App
      run: |
        xcodebuild -project notch-browser/notch-browser.xcodeproj \
                   -scheme "notch-browser" \
                   -configuration Release \
                   -derivedDataPath build_output \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CLEAN_BEFORE_BUILD=YES
        
        # Cari file .app secara brutal biar ga salah copy
        mkdir -p dist
        find build_output -name "*.app" -exec cp -R {} dist/DynamicNotch.app \;
    
    - name: Archive Production Build
      uses: actions/upload-artifact@v4
      with:
        name: DynamicNotch-App
        path: dist/DynamicNotch.app
