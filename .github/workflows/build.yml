name: Build DynamicNotch

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build macOS App (Intel x86_64)
    runs-on: macos-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Build App for Intel
      run: |
        xcodebuild -project notch-browser/notch-browser.xcodeproj \
                   -scheme "DynamicNotchDemo" \
                   -configuration Release \
                   -arch x86_64 \
                   -derivedDataPath build_output \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CLEAN_BEFORE_BUILD=YES
        
        mkdir -p dist
        cp -R build_output/Build/Products/Release/ dist/
    
    - name: Archive Production Build
      uses: actions/upload-artifact@v4
      with:
        name: DynamicNotch-App-Intel
        path: dist/
