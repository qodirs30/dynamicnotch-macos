name: Build DynamicNotch

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build macOS App
    runs-on: macos-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Set up Xcode
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
    
    - name: Build Demo App
      run: |
        chmod +x Scripts/build-demo-app.sh
        ./Scripts/build-demo-app.sh
    
    - name: Archive Production Build
      uses: actions/upload-artifact@v4
      with:
        name: DynamicNotchDemo
        path: dist/DynamicNotchDemo.app
