name: Build DynamicNotch

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build macOS App
    runs-on: macos-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Build App Brutally
      run: |
        # Cari file .xcodeproj secara otomatis di manapun dia berada
        PROJECT_PATH=$(find . -name "*.xcodeproj" | head -n 1)
        echo "Found project at: $PROJECT_PATH"
        
        # Build pakai perintah paling umum
        xcodebuild -project "$PROJECT_PATH" \
                   -alltargets \
                   -configuration Release \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   clean build
        
        # Cari file .app hasil build
        mkdir -p dist
        find . -name "*.app" | grep "Release" | head -n 1 > app_path.txt
        cp -R $(cat app_path.txt) dist/DynamicNotch.app
    
    - name: Archive Production Build
      uses: actions/upload-artifact@v4
      with:
        name: DynamicNotch-App
        path: dist/DynamicNotch.app
